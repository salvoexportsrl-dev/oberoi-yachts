<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Payment status | Oberoi Yachts</title><style>body{margin:0;background:#081a2c;color:#f9f6ef;font:17px/1.65 system-ui,Arial,sans-serif}main{max-width:650px;margin:12vh auto;padding:32px;text-align:center}h1{color:#d9b86c;font:normal 42px Georgia,serif}a{color:#d9b86c}#status{padding:20px;border:1px solid #6a6046;border-radius:12px}</style></head><body><main><h1>OBEROI YACHTS</h1><h2>Booking payment status</h2><p id="status" role="status">Verifying your payment securely…</p><p>For assistance: <a href="mailto:booking@oberoi.yachts">booking@oberoi.yachts</a></p><a href="/">Return to Oberoi Yachts</a></main><script>
(async()=>{const box=document.getElementById('status');const id=new URLSearchParams(location.search).get('session_id');if(!id||!/^cs_live_[A-Za-z0-9]{20,200}$/.test(id)){box.textContent='No payment reference found. If you paid, please contact our booking team.';return}try{const response=await fetch('https://eftswzwxcdkrimnyvnrg.supabase.co/functions/v1/oy-verify-paid-checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:id})});const data=await response.json();if(!response.ok)throw Error('We could not verify the payment at this time. Please contact our booking team and do not pay again.');box.textContent=data.paid?'Payment received. Thank you! Your payment has been verified. Our booking team will follow up with your charter details.':'Payment is not yet confirmed. If you completed payment, please contact our booking team before attempting another payment.'}catch(e){box.textContent=e.message||'Unable to verify payment. Please contact our booking team.'}})();
</script></body></html>
